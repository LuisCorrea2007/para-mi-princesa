version: '3.8'

services:
  # ===========================================
  # BASE DE DATOS - PostgreSQL
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: nuestro-espacio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuestro_espacio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: nuestro_espacio
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DOCKER_DB_PORT:-5432}:5432"
    networks:
      - nuestro-espacio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuestro_espacio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # BACKEND - Node.js + Express
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: nuestro-espacio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nuestro_espacio}:${POSTGRES_PASSWORD:-password123}@postgres:5432/nuestro_espacio?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
      - logs_data:/app/logs
    ports:
      - "${DOCKER_BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nuestro-espacio-network
    command: >
      sh -c "npx prisma migrate deploy && 
             npx prisma generate && 
             npm start"

  # ===========================================
  # FRONTEND - React + Vite (Production Build)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:${DOCKER_BACKEND_PORT:-5000}/api
        VITE_WS_URL: http://localhost:${DOCKER_BACKEND_PORT:-5000}
    container_name: nuestro-espacio-frontend
    restart: unless-stopped
    ports:
      - "${DOCKER_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - nuestro-espacio-network

  # ===========================================
  # NGINX - Reverse Proxy (Opcional para producción)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: nuestro-espacio-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - nuestro-espacio-network
    profiles:
      - with-nginx

# ===========================================
# VOLÚMENES PERSISTENTES
# ===========================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local
  logs_data:
    driver: local

# ===========================================
# REDES
# ===========================================
networks:
  nuestro-espacio-network:
    driver: bridge
